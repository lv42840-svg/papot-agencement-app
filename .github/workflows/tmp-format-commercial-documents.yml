name: Temporary Commercial Documents Formatter

on:
  push:
    branches: [arch/commercial-documents-server-files]
    paths:
      - .github/workflows/tmp-format-commercial-documents.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/commercial-documents-server-files
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/commercial-document-files.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/commercial-document-files.integration.test.ts
          git commit -m "Format Commercial document cutover test"
          git push origin HEAD:arch/commercial-documents-server-files
