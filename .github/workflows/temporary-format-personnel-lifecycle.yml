name: Format personnel lifecycle branch
on:
  push:
    branches: [feat/planning-personnel-lifecycle-copy-print-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format personnel and weekly board
        run: |
          npx --no-install prettier --write src/lib/planning/domain.ts src/lib/planning/personnel.ts src/lib/planning/capacity.ts src/lib/planning/mutations.ts src/lib/planning/weekly-board.ts src/app/api/desktop/planning/route.ts src/app/api/desktop/planning/weekly-board/route.ts src/components/grand-planning-workspace.tsx src/components/weekly-team-board.tsx src/components/weekly-board-day-cell.tsx tests/planning-domain.test.ts tests/planning-postgres.integration.test.ts tests/planning-personnel-lifecycle.test.ts tests/planning-personnel-lifecycle-ui.test.ts
      - name: Commit formatted sources
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/domain.ts src/lib/planning/personnel.ts src/lib/planning/capacity.ts src/lib/planning/mutations.ts src/lib/planning/weekly-board.ts src/app/api/desktop/planning/route.ts src/app/api/desktop/planning/weekly-board/route.ts src/components/grand-planning-workspace.tsx src/components/weekly-team-board.tsx src/components/weekly-board-day-cell.tsx tests/planning-domain.test.ts tests/planning-postgres.integration.test.ts tests/planning-personnel-lifecycle.test.ts tests/planning-personnel-lifecycle-ui.test.ts
            git commit -m 'chore(planning): format personnel lifecycle and daily copying'
            git push origin HEAD:feat/planning-personnel-lifecycle-copy-print-20261017
          fi
