name: Format PR 267 temporary
on:
  push:
    branches:
      - feat/factures-fournisseurs-ergonomie-et-historique-couts-20261117
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/server-db/migrations.ts src/lib/pennylane/store.ts src/lib/pennylane/purchase-invoice-store.ts src/lib/pennylane/connection.ts src/components/calculated-amount-input.tsx src/components/purchase-invoices-workspace.tsx src/app/api/desktop/purchase-invoices/route.ts tests/purchase-invoices-refonte-ui.test.ts tests/pennylane-purchase-invoices.integration.test.ts docs/pennylane-purchase-invoices.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/server-db/migrations.ts src/lib/pennylane/store.ts src/lib/pennylane/purchase-invoice-store.ts src/lib/pennylane/connection.ts src/components/calculated-amount-input.tsx src/components/purchase-invoices-workspace.tsx src/app/api/desktop/purchase-invoices/route.ts tests/purchase-invoices-refonte-ui.test.ts tests/pennylane-purchase-invoices.integration.test.ts docs/pennylane-purchase-invoices.md
          if ! git diff --cached --quiet; then
            git commit -m "style: formater la refonte factures fournisseurs"
            git push origin HEAD:${{ github.ref_name }}
          fi
