name: Format billing PR 231

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-billing:
    if: github.event.pull_request.number == 231 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/billing-chantier-invoices-settings-history-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format billing changes
        run: |
          ./node_modules/.bin/prettier --write \
            src/lib/billing/domain.ts \
            src/app/api/desktop/billing/route.ts \
            src/components/settings-section-nav.tsx \
            src/app/settings/billing/page.tsx \
            src/components/billing-titles-settings.tsx \
            src/components/billing-document-editor.tsx \
            src/components/billing-workspace.tsx \
            src/components/chantier-billing-tab.tsx \
            src/components/chantier-workspace.tsx \
            tests/billing-document-editor-ui.test.ts \
            tests/billing-titles-settings.test.ts
      - name: Commit formatting on the PR branch
        run: |
          git add -- src/lib/billing/domain.ts src/app/api/desktop/billing/route.ts src/components/settings-section-nav.tsx src/app/settings/billing/page.tsx src/components/billing-titles-settings.tsx src/components/billing-document-editor.tsx src/components/billing-workspace.tsx src/components/chantier-billing-tab.tsx src/components/chantier-workspace.tsx tests/billing-document-editor-ui.test.ts tests/billing-titles-settings.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(billing): format chantier invoices and title settings"
          git push origin HEAD:refs/heads/feat/billing-chantier-invoices-settings-history-20261031
