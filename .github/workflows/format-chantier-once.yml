name: Format chantier once

on:
  push:
    branches: [fix/chantier-prettier-verified-20261004]
    paths: [.github/workflows/format-chantier-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chantier-prettier-verified-20261004
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the installed formatter version
        run: |
          node -e 'if (require("prettier/package.json").version !== "3.4.2") process.exit(1)'
          ./node_modules/.bin/prettier --version
      - name: Check AST stability and apply the actual formatter
        run: |
          ./node_modules/.bin/prettier src/components/chantier-workspace.tsx --debug-check
          ./node_modules/.bin/prettier src/components/chantier-workspace.tsx --write
          ./node_modules/.bin/prettier src/components/chantier-workspace.tsx --check
          git diff --check
      - name: Commit only the formatted source file
        run: |
          if git diff --quiet -- src/components/chantier-workspace.tsx; then
            echo "The source file is already formatted."
            exit 0
          fi
          git diff --stat -- src/components/chantier-workspace.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/chantier-workspace.tsx
          git commit -m 'style(chantiers): apply Prettier 3.4.2 output'
          git push origin HEAD:fix/chantier-prettier-verified-20261004
