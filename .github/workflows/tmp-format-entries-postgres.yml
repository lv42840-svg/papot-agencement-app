name: Temporary Entries PostgreSQL Formatter

on:
  push:
    branches: [arch/entries-postgres-cutover]
    paths:
      - .github/workflows/tmp-format-entries-postgres.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/entries-postgres-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/entries/nextcloud-repository.ts tests/entries-postgres.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/entries/nextcloud-repository.ts tests/entries-postgres.integration.test.ts
          git commit -m "Format Entries PostgreSQL cutover"
          git push origin HEAD:arch/entries-postgres-cutover
