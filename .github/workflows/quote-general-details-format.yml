name: Quote general details format

on:
  push:
    branches:
      - feat/quote-general-details

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(quotes): appliquer prettier details devis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/api/desktop/quotes/[quoteId]/details/route.ts src/components/quote-general-info-editor.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/desktop/quotes/[quoteId]/details/route.ts src/components/quote-general-info-editor.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(quotes): appliquer prettier details devis"
          git push origin HEAD:feat/quote-general-details
