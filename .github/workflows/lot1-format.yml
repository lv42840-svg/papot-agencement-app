name: Lot 1 formatting
on:
  push:
    branches: [feat/achats-destinations-finance-lot1]
permissions:
  contents: write
concurrency:
  group: lot1-format
  cancel-in-progress: true
jobs:
  format:
    if: github.ref == 'refs/heads/feat/achats-destinations-finance-lot1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/achats-destinations-finance-lot1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Finish explicit invoiced-revenue regression and display binding
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(path, before, after, marker) {
            const source = fs.readFileSync(path, 'utf8');
            if (source.includes(marker)) return;
            if (source.split(before).length !== 2) throw new Error('Unexpected source: ' + path);
            fs.writeFileSync(path, source.replace(before, after));
          }
          replaceOnce('tests/chantier-profitability.test.ts',
            '      laborCostCents: 70_000,\n      purchaseCostCents: 50_000,\n    });\n    expect(complete.actualTotalCostCents).toBe(120_000);\n    expect(complete.actualMarginCents).toBe(-20_000);\n    expect(complete.actualMarginPercent).toBeCloseTo(-16.666666, 5);',
            '      laborCostCents: 70_000,\n      purchaseCostCents: 50_000,\n      invoicedRevenueCents: 90_000,\n    });\n    expect(complete.actualTotalCostCents).toBe(120_000);\n    expect(complete.actualMarginCents).toBe(-30_000);\n    expect(complete.actualMarginPercent).toBe(-25);',
            'invoicedRevenueCents: 90_000');
          replaceOnce('tests/chantier-profitability.test.ts',
            'calculates real global margin only when both real cost sources are available',
            'calculates real margin from issued revenue, different from quotes, and both real cost sources',
            'calculates real margin from issued revenue');
          replaceOnce('src/components/chantier-profitability-panel.tsx',
            '          label="Facturé client HT"\n          value="Non disponible"\n          detail="Factures clients à raccorder à la comptabilité"',
            '          label="Facturé client HT"\n          value={money(result.actualRevenueCents)}\n          detail={result.actualRevenueCents === null ? "Factures clients à raccorder à la comptabilité" : "Factures émises nettes des avoirs"}',
            'value={money(result.actualRevenueCents)}');
          NODE
      - name: Format only changed source, tests and documentation
        run: |
          git diff --name-only -z ea4e06208c52ef1d7c50ee460ac30aadeec2af9e -- src tests docs | xargs -0 -r ./node_modules/.bin/prettier --write
          git add -- src tests docs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: explicit invoice basis and formatted lot 1 changes'
            git push origin HEAD:refs/heads/feat/achats-destinations-finance-lot1
          fi
      - name: Package source for independent review
        run: tar -czf /tmp/papot-lot1-source.tgz src tests docs package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts eslint.config.mjs .prettierrc.json
      - uses: actions/upload-artifact@v4
        with:
          name: lot1-source-review
          path: /tmp/papot-lot1-source.tgz
          retention-days: 1
