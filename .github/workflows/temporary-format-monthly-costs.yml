name: Format monthly labor costs
on:
  push:
    branches: [feat/heures-couts-mensuels-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed sources and tests
        run: |
          npx --no-install prettier --write src/lib/payroll/monthly-labor-costs.ts src/lib/payroll/monthly-labor-costs-repository.ts src/lib/payroll/chantier-labor-cost.ts src/lib/server-db/migrations.ts src/app/api/desktop/payroll/monthly-labor-costs/route.ts src/app/api/desktop/chantiers/route.ts src/components/chantier-workspace.tsx src/components/chantier-profitability-panel.tsx src/components/monthly-labor-costs-workspace.tsx src/components/heures-tabs.tsx src/app/heures/page.tsx tests/monthly-labor-costs.test.ts tests/monthly-labor-costs-ui.test.ts tests/chantier-profitability-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/payroll/monthly-labor-costs.ts src/lib/payroll/monthly-labor-costs-repository.ts src/lib/payroll/chantier-labor-cost.ts src/lib/server-db/migrations.ts src/app/api/desktop/payroll/monthly-labor-costs/route.ts src/app/api/desktop/chantiers/route.ts src/components/chantier-workspace.tsx src/components/chantier-profitability-panel.tsx src/components/monthly-labor-costs-workspace.tsx src/components/heures-tabs.tsx src/app/heures/page.tsx tests/monthly-labor-costs.test.ts tests/monthly-labor-costs-ui.test.ts tests/chantier-profitability-ui.test.ts
            git commit -m 'chore(hours): format monthly cost module'
            git push origin HEAD:feat/heures-couts-mensuels-20261017
          fi
