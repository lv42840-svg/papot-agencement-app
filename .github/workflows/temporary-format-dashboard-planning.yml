name: Format dashboard weekly planning
on:
  push:
    branches: [feat/accueil-planning-semaine-reel-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format dashboard sources and tests
        run: |
          npx --no-install prettier --write src/lib/planning/dashboard-week.ts src/components/dashboard-weekly-planning.tsx src/app/desktop-ready/page.tsx tests/dashboard-week.test.ts tests/dashboard-weekly-planning-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/dashboard-week.ts src/components/dashboard-weekly-planning.tsx src/app/desktop-ready/page.tsx tests/dashboard-week.test.ts tests/dashboard-weekly-planning-ui.test.ts
            git commit -m 'chore(dashboard): format weekly planning preview'
            git push origin HEAD:feat/accueil-planning-semaine-reel-20261017
          fi
