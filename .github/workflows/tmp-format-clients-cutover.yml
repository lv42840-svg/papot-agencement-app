name: Temporary Clients Cutover Formatter

on:
  push:
    branches: [arch/clients-postgres-cutover]
    paths:
      - .github/workflows/tmp-format-clients-cutover.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/clients-postgres-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          src/lib/clients/cutover.ts
          src/lib/clients/nextcloud-repository.ts
          src/lib/clients/postgres-repository.ts
          tests/clients-postgres.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/clients/cutover.ts src/lib/clients/nextcloud-repository.ts src/lib/clients/postgres-repository.ts tests/clients-postgres.integration.test.ts
          git commit -m "Format Clients PostgreSQL cutover"
          git push origin HEAD:arch/clients-postgres-cutover
