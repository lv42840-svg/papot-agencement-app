name: Quote adjusted line totals temporary

on:
  push:
    branches:
      - fix/quote-adjusted-line-totals

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-adjusted-line-totals
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/patch-quote-adjusted-line-totals.py
      - run: npx prettier --write src/components/quote-structured-lines-editor.tsx tests/quote-adjusted-line-totals-ui.test.ts tests/quote-adjustments.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- tests/quote-adjusted-line-totals-ui.test.ts tests/quote-adjustments.test.ts tests/quote-table-layout.test.ts
      - name: Commit adjusted line totals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-structured-lines-editor.tsx tests/quote-adjusted-line-totals-ui.test.ts tests/quote-adjustments.test.ts
          git commit -m "fix(quotes): afficher les totaux ajustes par ligne"
          git push
