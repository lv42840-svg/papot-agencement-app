name: Temp format devis polish v3
on:
  push:
    branches:
      - fix/recette-devis-polish-v3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          "src/app/api/desktop/quotes/[quoteId]/send/route.ts"
          src/components/quote-legal-details-editor.tsx
          src/components/quote-pricing-adjustments-editor.tsx
          src/components/quote-send-action.tsx
          src/components/quote-structured-lines-editor.tsx
          src/lib/quotes/adjustments.ts
          src/lib/quotes/word-v2-renderer.ts
          tests/quote-adjustments.test.ts
          tests/quote-global-ui-invariants.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/api/desktop/quotes/[quoteId]/send/route.ts" src/components/quote-legal-details-editor.tsx src/components/quote-pricing-adjustments-editor.tsx src/components/quote-send-action.tsx src/components/quote-structured-lines-editor.tsx src/lib/quotes/adjustments.ts src/lib/quotes/word-v2-renderer.ts tests/quote-adjustments.test.ts tests/quote-global-ui-invariants.test.ts
          git commit -m "style: apply prettier devis polish v3"
          git push
