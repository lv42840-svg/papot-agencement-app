name: Format billing PR 227

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-billing:
    if: github.event.pull_request.number == 227 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/billing-progress-document-consistency-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only the four billing files
        run: |
          ./node_modules/.bin/prettier --write \
            src/app/api/desktop/billing/route.ts \
            src/components/billing-document-editor.tsx \
            src/lib/billing/domain.ts \
            tests/billing-document-editor.test.ts
      - name: Commit formatting on the existing PR branch
        run: |
          git add -- src/app/api/desktop/billing/route.ts src/components/billing-document-editor.tsx src/lib/billing/domain.ts tests/billing-document-editor.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(billing): format approval and situation changes"
          git push origin HEAD:refs/heads/fix/billing-progress-document-consistency-20261031
