name: Temporary quote email formatter

on:
  push:
    branches:
      - fix/quote-email-finalize

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format quote email files
        run: |
          npx prettier --write             src/components/quote-email-settings-workspace.tsx             src/components/quote-send-action.tsx             src/lib/quote-email-settings/domain.ts             src/lib/quotes/email.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/components/quote-email-settings-workspace.tsx             src/components/quote-send-action.tsx             src/lib/quote-email-settings/domain.ts             src/lib/quotes/email.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format quote email files"
          git push
