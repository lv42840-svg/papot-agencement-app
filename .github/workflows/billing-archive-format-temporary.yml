name: Temporary billing PDF archive formatter

on:
  push:
    branches:
      - feat/billing-chantier-market-foundation
    paths:
      - .github/workflows/billing-archive-format-temporary.yml

permissions:
  contents: write

jobs:
  archive-prettier:
    if: github.ref == 'refs/heads/feat/billing-chantier-market-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          git fetch origin feat/billing-chantier-market-foundation
          git checkout -B feat/billing-chantier-market-foundation origin/feat/billing-chantier-market-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/lib/billing/native-pdf-archive.ts \
            src/lib/server-db/migrations.ts \
            src/lib/local-db/runtime.ts \
            src/app/api/desktop/billing/issue/route.ts \
            'src/app/api/desktop/billing/issued/[invoiceId]/pdf/route.ts' \
            tests/billing-native-pdf-archive.test.ts \
            tests/billing-native-issuance-ui.test.ts \
            docs/backup-restore.md
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/billing/native-pdf-archive.ts src/lib/server-db/migrations.ts src/lib/local-db/runtime.ts src/app/api/desktop/billing/issue/route.ts 'src/app/api/desktop/billing/issued/[invoiceId]/pdf/route.ts' tests/billing-native-pdf-archive.test.ts tests/billing-native-issuance-ui.test.ts docs/backup-restore.md
            git commit -m "style(billing): format native invoice PDF archive and integrity tests"
            git push
          fi
