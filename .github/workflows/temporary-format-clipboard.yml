name: Format planning clipboard feature
on:
  push:
    branches: [feat/planning-clipboard-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format new planning changes
        run: |
          npx --no-install prettier --write src/components/planning-excel-grid.tsx src/components/grand-planning-workspace.tsx src/lib/planning/clipboard.ts src/lib/planning/mutations.ts src/lib/planning/time-markers.ts src/app/api/desktop/planning/route.ts tests/planning-clipboard.test.ts tests/planning-time-markers.test.ts tests/planning-time-markers-ui.test.ts tests/planning-continuous-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/planning-excel-grid.tsx src/components/grand-planning-workspace.tsx src/lib/planning/clipboard.ts src/lib/planning/mutations.ts src/lib/planning/time-markers.ts src/app/api/desktop/planning/route.ts tests/planning-clipboard.test.ts tests/planning-time-markers.test.ts tests/planning-time-markers-ui.test.ts tests/planning-continuous-ui.test.ts
            git commit -m 'chore(planning): format clipboard feature'
            git push origin HEAD:feat/planning-clipboard-20261017
          fi
