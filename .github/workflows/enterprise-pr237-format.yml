name: Format enterprise profitability PR 237

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.number == 237 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/bc-edit-enterprise-profitability-labor-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier on changed files
        run: |
          ./node_modules/.bin/prettier --write \
            src/lib/quotes/commercial-summary.ts \
            src/lib/chantiers/profitability.ts \
            src/components/chantier-profitability-panel.tsx \
            src/lib/purchases/domain.ts \
            src/lib/purchases/pdf.ts \
            src/app/api/desktop/purchases/route.ts \
            src/components/purchase-orders-workspace.tsx \
            src/components/chantier-commandes-tab.tsx \
            src/components/purchase-order-edit-workspace.tsx \
            src/app/achats/'[orderId]'/modifier/page.tsx \
            src/lib/pilotage/company-profitability.ts \
            src/app/api/desktop/pilotage/rentabilite/route.ts \
            src/components/enterprise-profitability-workspace.tsx \
            src/app/pilotage/rentabilite/page.tsx \
            src/lib/desktop/navigation.ts \
            tests/purchase-orders-pdf.test.ts \
            tests/purchase-orders.test.ts \
            tests/chantier-profitability.test.ts \
            tests/enterprise-profitability-and-bc-edits.test.ts
      - name: Commit formatting
        run: |
          git add -- src/lib/quotes/commercial-summary.ts src/lib/chantiers/profitability.ts src/components/chantier-profitability-panel.tsx src/lib/purchases/domain.ts src/lib/purchases/pdf.ts src/app/api/desktop/purchases/route.ts src/components/purchase-orders-workspace.tsx src/components/chantier-commandes-tab.tsx src/components/purchase-order-edit-workspace.tsx src/app/achats/'[orderId]'/modifier/page.tsx src/lib/pilotage/company-profitability.ts src/app/api/desktop/pilotage/rentabilite/route.ts src/components/enterprise-profitability-workspace.tsx src/app/pilotage/rentabilite/page.tsx src/lib/desktop/navigation.ts tests/purchase-orders-pdf.test.ts tests/purchase-orders.test.ts tests/chantier-profitability.test.ts tests/enterprise-profitability-and-bc-edits.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format BC editing and enterprise profitability"
          git push origin HEAD:refs/heads/feat/bc-edit-enterprise-profitability-labor-20261031
