name: Format quote component temp

on:
  push:
    branches:
      - feat/quote-component-publish-library

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-component-publish-library
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/quote-library-publish.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git add tests/quote-library-publish.test.ts
            git commit -m "style: formater les tests de publication Bibliotheque"
            git push
          fi
