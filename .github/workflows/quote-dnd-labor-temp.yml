name: Quote DnD labor temporary

on:
  push:
    branches:
      - feat/quote-dnd-labor-components

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-dnd-labor-components
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply main patch
        continue-on-error: true
        run: python scripts/patch-quote-dnd-labor-components.py
      - run: python scripts/patch-quote-dnd-labor-components-tail.py
      - run: npx prettier --write src/lib/production-activity.ts src/lib/library/component.ts src/lib/library/required-labor-components.ts src/lib/library/catalog-edit.ts src/lib/quotes/item-reorder.ts src/lib/quotes/model.ts src/lib/quotes/library-component.ts src/lib/quotes/library-publish.ts src/lib/quotes/mutations.ts src/app/api/desktop/quotes/route.ts src/components/library-workspace.tsx src/components/quote-structured-lines-editor.tsx tests/library-required-labor.test.ts tests/quote-item-reorder.test.ts tests/quote-labor-activity.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- tests/library-required-labor.test.ts tests/quote-item-reorder.test.ts tests/quote-labor-activity.test.ts tests/quote-item-delete.test.ts tests/quote-heading-mutations.test.ts tests/quote-lines-editor.test.ts tests/library-storage.test.ts
      - name: Commit combined feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "feat(quotes): glisser deposer et heures metier"
          git push
