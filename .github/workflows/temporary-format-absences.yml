name: Format absence grouping branch
on:
  push:
    branches: [feat/planning-absences-person-tabs-week-groups-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format source files
        run: |
          npx --no-install prettier --write src/lib/planning/domain.ts src/lib/planning/mutations.ts src/lib/planning/absence-display.ts src/app/api/desktop/planning/route.ts src/components/grand-planning-workspace.tsx tests/planning-absence-display.test.ts tests/planning-absence-tabs-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/domain.ts src/lib/planning/mutations.ts src/lib/planning/absence-display.ts src/app/api/desktop/planning/route.ts src/components/grand-planning-workspace.tsx tests/planning-absence-display.test.ts tests/planning-absence-tabs-ui.test.ts
            git commit -m 'chore(planning): format absence register'
            git push origin HEAD:feat/planning-absences-person-tabs-week-groups-20261017
          fi
