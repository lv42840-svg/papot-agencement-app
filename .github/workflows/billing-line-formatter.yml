name: Temporary Line Progress Formatter
on:
  push:
    branches: [feat/billing-progress-by-quote-line-20261017]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/billing-progress-by-quote-line-20261017
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format modified files
        run: npx prettier --write src/lib/billing/domain.ts src/lib/billing/progress.ts src/lib/billing/sources.ts src/app/api/desktop/billing/route.ts src/components/billing-workspace.tsx tests/billing-line-progress.test.ts tests/billing-line-progress-ui.test.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/billing/domain.ts src/lib/billing/progress.ts src/lib/billing/sources.ts src/app/api/desktop/billing/route.ts src/components/billing-workspace.tsx tests/billing-line-progress.test.ts tests/billing-line-progress-ui.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(billing): format line situations'
            git push origin HEAD:refs/heads/feat/billing-progress-by-quote-line-20261017
          fi
