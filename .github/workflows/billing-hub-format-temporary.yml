name: Temporary billing hub formatter

on:
  push:
    branches:
      - feat/billing-hub-clarity-20261121
    paths:
      - .github/workflows/billing-hub-format-temporary.yml

permissions:
  contents: write

jobs:
  formatter:
    if: github.ref == 'refs/heads/feat/billing-hub-clarity-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          git fetch origin feat/billing-hub-clarity-20261121
          git checkout -B feat/billing-hub-clarity-20261121 origin/feat/billing-hub-clarity-20261121
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/app/api/desktop/billing/route.ts \
            src/components/billing-workspace.tsx \
            src/components/billing-hub-cards.tsx \
            src/components/chantier-billing-tab.tsx \
            src/components/billing-document-editor.tsx \
            src/app/globals.css \
            tests/billing-hub-ui.test.ts \
            tests/dashboard-sold-ui.test.ts \
            tests/billing-document-editor-ui.test.ts
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/api/desktop/billing/route.ts src/components/billing-workspace.tsx src/components/billing-hub-cards.tsx src/components/chantier-billing-tab.tsx src/components/billing-document-editor.tsx src/app/globals.css tests/billing-hub-ui.test.ts tests/dashboard-sold-ui.test.ts tests/billing-document-editor-ui.test.ts
            git commit -m "style(billing): format refactored hub and issued register"
            git pull --rebase origin feat/billing-hub-clarity-20261121
            git push
          fi
