name: Format PR 265 temporary
on:
  push:
    branches:
      - fix/commercial-v2-statut-perdu-unique-20261117
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/commercial/domain.ts src/components/commercial-workspace.tsx src/components/commercial-workspace-v2.tsx tests/commercial-domain.test.ts tests/commercial-lost-status-ui.test.ts tests/commercial-list-filter.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/commercial/domain.ts src/components/commercial-workspace.tsx src/components/commercial-workspace-v2.tsx tests/commercial-domain.test.ts tests/commercial-lost-status-ui.test.ts tests/commercial-list-filter.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formater statut Perdu dans Commercial"
            git push origin HEAD:${{ github.ref_name }}
          fi
