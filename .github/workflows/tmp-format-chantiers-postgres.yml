name: Temporary Chantiers PostgreSQL Formatter

on:
  push:
    branches: [arch/chantiers-postgres-cutover]
    paths:
      - .github/workflows/tmp-format-chantiers-postgres.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/chantiers-postgres-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/chantiers-postgres.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/chantiers-postgres.integration.test.ts
          git commit -m "Format Chantiers PostgreSQL integration test"
          git push origin HEAD:arch/chantiers-postgres-cutover
