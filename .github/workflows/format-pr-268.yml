name: Format PR 268 temporary
on:
  push:
    branches:
      - fix/factures-fournisseurs-filtre-a-valider-20261118
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/purchase-invoices-workspace.tsx src/lib/pennylane/purchase-allocations.ts tests/pennylane-purchase-allocations.test.ts tests/purchase-invoices-refonte-ui.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/purchase-invoices-workspace.tsx src/lib/pennylane/purchase-allocations.ts tests/pennylane-purchase-allocations.test.ts tests/purchase-invoices-refonte-ui.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formater le filtre factures a valider"
            git push origin HEAD:${{ github.ref_name }}
          fi
