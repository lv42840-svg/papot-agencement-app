name: Format concurrency touched files

on:
  push:
    branches:
      - fix/agencement-concurrent-writes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format only concurrency-touched files
        run: |
          npx prettier --write             "src/app/api/admin/company-profile/route.ts"             "src/app/api/desktop/chantiers/route.ts"             "src/app/api/desktop/commercial/[caseId]/documents/route.ts"             "src/app/api/desktop/commercial/route.ts"             "src/app/api/desktop/entries/[entryId]/attachments/route.ts"             "src/app/api/desktop/entries/route.ts"             "src/app/api/desktop/planning/route.ts"             "src/app/api/desktop/quotes/[quoteId]/details/route.ts"             "src/app/api/desktop/quotes/[quoteId]/legal/route.ts"             "src/app/api/desktop/quotes/route.ts"             "src/app/api/me/accent/route.ts"             "src/app/api/me/planning-preferences/route.ts"             "src/components/accent-picker.tsx"             "src/components/chantier-workspace.tsx"             "src/components/client-vat-defaults-panel.tsx"             "src/components/clients-workspace.tsx"             "src/components/commercial-workspace.tsx"             "src/components/grand-planning-workspace.tsx"             "src/components/quote-general-info-editor.tsx"             "src/components/quote-internal-notes-editor.tsx"             "src/components/quote-legal-details-editor.tsx"             "src/components/quote-lifecycle-actions.tsx"             "src/components/quote-lines-editor.tsx"             "src/components/quote-pricing-adjustments-editor.tsx"             "src/components/quote-send-action.tsx"             "src/components/quote-structured-lines-editor.tsx"             "src/lib/auth/user-admin.ts"             "src/lib/chantiers/mutations.ts"             "src/lib/commercial/mutations.ts"             "src/lib/company-profile/local-repository.ts"             "src/lib/entries/mutations.ts"             "src/lib/quotes/concurrency.ts"             "tests/accent-preference-concurrency.test.ts"             "tests/commercial-postgres.integration.test.ts"             "tests/entries-postgres.integration.test.ts"             "tests/planning-concurrency-api.test.ts"             "tests/planning-potential-collapse-preference.test.ts"
      - name: Commit formatting if needed
        run: |
          git add             "src/app/api/admin/company-profile/route.ts"             "src/app/api/desktop/chantiers/route.ts"             "src/app/api/desktop/commercial/[caseId]/documents/route.ts"             "src/app/api/desktop/commercial/route.ts"             "src/app/api/desktop/entries/[entryId]/attachments/route.ts"             "src/app/api/desktop/entries/route.ts"             "src/app/api/desktop/planning/route.ts"             "src/app/api/desktop/quotes/[quoteId]/details/route.ts"             "src/app/api/desktop/quotes/[quoteId]/legal/route.ts"             "src/app/api/desktop/quotes/route.ts"             "src/app/api/me/accent/route.ts"             "src/app/api/me/planning-preferences/route.ts"             "src/components/accent-picker.tsx"             "src/components/chantier-workspace.tsx"             "src/components/client-vat-defaults-panel.tsx"             "src/components/clients-workspace.tsx"             "src/components/commercial-workspace.tsx"             "src/components/grand-planning-workspace.tsx"             "src/components/quote-general-info-editor.tsx"             "src/components/quote-internal-notes-editor.tsx"             "src/components/quote-legal-details-editor.tsx"             "src/components/quote-lifecycle-actions.tsx"             "src/components/quote-lines-editor.tsx"             "src/components/quote-pricing-adjustments-editor.tsx"             "src/components/quote-send-action.tsx"             "src/components/quote-structured-lines-editor.tsx"             "src/lib/auth/user-admin.ts"             "src/lib/chantiers/mutations.ts"             "src/lib/commercial/mutations.ts"             "src/lib/company-profile/local-repository.ts"             "src/lib/entries/mutations.ts"             "src/lib/quotes/concurrency.ts"             "tests/accent-preference-concurrency.test.ts"             "tests/commercial-postgres.integration.test.ts"             "tests/entries-postgres.integration.test.ts"             "tests/planning-concurrency-api.test.ts"             "tests/planning-potential-collapse-preference.test.ts"
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git -c user.name="PAPOT development" -c user.email="dev@papot.app"             commit -m "style(agencement): format concurrency changes"
          git push origin HEAD:fix/agencement-concurrent-writes
