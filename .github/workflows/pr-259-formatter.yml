name: Temporary PR 259 formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 259
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/check-payroll-snapshot-before-purging-test-hours-20261117
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write scripts/ops/purge-two-test-chantiers.cjs tests/ops-purge-two-test-chantiers.test.ts
      - name: Push formatting result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ops/purge-two-test-chantiers.cjs tests/ops-purge-two-test-chantiers.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: format targeted payroll snapshot guard'
            git push origin HEAD:ops/check-payroll-snapshot-before-purging-test-hours-20261117
          fi
