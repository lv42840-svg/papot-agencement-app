name: Temporary Windows Installer Fix 47 v0.1.1

on:
  push:
    branches: [test/windows-installer-fix-47-v011]
    paths:
      - .github/workflows/tmp-windows-installer-fix47-v011.yml

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp test version 0.1.1
        run: npm version 0.1.1 --no-git-tag-version
      - run: npm run desktop:dist -- --publish never
      - name: List installer output
        shell: pwsh
        run: Get-ChildItem -Path release -Recurse | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: PAPOT-AGENCEMENT-Windows-Test-0.1.1
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
