name: Temp format devis finitions
on:
  push:
    branches:
      - fix/recette-devis-finitions-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/quotes/word-v2-renderer.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/quotes/word-v2-renderer.ts
          git commit -m "style: apply prettier devis finitions"
          git push
