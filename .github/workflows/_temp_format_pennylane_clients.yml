name: Temporary format Pennylane clients

on:
  push:
    branches:
      - feat/pennylane-clients-import

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format touched source files
        run: |
          npx prettier --write \
            src/lib/clients/domain.ts \
            src/lib/clients/postgres-repository.ts \
            src/lib/server-db/migrations.ts \
            src/lib/pennylane/customers.ts \
            src/lib/pennylane/customer-import-store.ts \
            src/app/api/desktop/clients/route.ts \
            src/app/api/desktop/clients/pennylane/route.ts \
            src/app/clients/pennylane/page.tsx \
            src/components/clients-workspace.tsx \
            src/components/pennylane-clients-workspace.tsx \
            tests/pennylane-customers.test.ts \
            tests/pennylane-customers.integration.test.ts \
            .github/workflows/ci.yml \
            docs/pennylane-customers-import.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(clients): formater le raccordement Pennylane"
            git push origin HEAD:feat/pennylane-clients-import
          fi
