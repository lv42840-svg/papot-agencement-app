name: Temporary Auth Cutover Formatter

on:
  push:
    branches: [arch/auth-postgres-cutover]
    paths:
      - .github/workflows/tmp-format-auth-cutover.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/auth-postgres-cutover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/auth/cutover.ts src/lib/auth/postgres-repository.ts src/lib/auth/runtime-store.ts tests/auth-postgres.integration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auth/cutover.ts src/lib/auth/postgres-repository.ts src/lib/auth/runtime-store.ts tests/auth-postgres.integration.test.ts
          git commit -m "Format Auth cutover"
          git push origin HEAD:arch/auth-postgres-cutover
