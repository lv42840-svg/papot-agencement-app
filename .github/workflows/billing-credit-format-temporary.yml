name: Temporary native credit note formatter

on:
  push:
    branches:
      - feat/billing-chantier-market-foundation
    paths:
      - .github/workflows/billing-credit-format-temporary.yml

permissions:
  contents: write

jobs:
  prettier-credit:
    if: github.ref == 'refs/heads/feat/billing-chantier-market-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          git fetch origin feat/billing-chantier-market-foundation
          git checkout -B feat/billing-chantier-market-foundation origin/feat/billing-chantier-market-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/lib/billing/native-credit-notes.ts \
            src/lib/billing/native-credit-pdf.ts \
            src/lib/billing/native-pdf-archive.ts \
            src/lib/billing/domain.ts \
            src/lib/auth/permission-catalog.ts \
            src/app/api/desktop/billing/route.ts \
            src/app/api/desktop/billing/credits/issue/route.ts \
            'src/app/api/desktop/billing/credits/issued/[creditId]/pdf/route.ts' \
            src/components/billing-document-editor.tsx \
            tests/billing-native-credit-notes.test.ts \
            tests/billing-native-credit-notes-ui.test.ts \
            docs/backup-restore.md
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/billing/native-credit-notes.ts src/lib/billing/native-credit-pdf.ts src/lib/billing/native-pdf-archive.ts src/lib/billing/domain.ts src/lib/auth/permission-catalog.ts src/app/api/desktop/billing/route.ts src/app/api/desktop/billing/credits/issue/route.ts 'src/app/api/desktop/billing/credits/issued/[creditId]/pdf/route.ts' src/components/billing-document-editor.tsx tests/billing-native-credit-notes.test.ts tests/billing-native-credit-notes-ui.test.ts docs/backup-restore.md
            git commit -m "style(billing): format legal credit note implementation"
            git push
          fi
