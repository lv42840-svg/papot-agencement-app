name: Quote component publish temporary

on:
  push:
    branches:
      - feat/quote-component-publish-library

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-component-publish-library
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/patch-quote-component-library.py
      - run: npx prettier --write src/components/quote-structured-lines-editor.tsx
      - run: npm test -- tests/quote-library-publish.test.ts
      - name: Commit component library action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-structured-lines-editor.tsx
          git commit -m "feat(quotes): ajouter +B sur les composants"
          git push
