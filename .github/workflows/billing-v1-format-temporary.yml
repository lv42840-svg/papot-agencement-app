name: Temporary billing V1 formatter

on:
  push:
    branches:
      - feat/billing-chantier-market-foundation
    paths:
      - .github/workflows/billing-v1-format-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  billing-v1-prettier:
    if: github.ref == 'refs/heads/feat/billing-chantier-market-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/lib/billing/draft-retention.ts \
            src/lib/billing/domain.ts \
            src/lib/billing/visa.ts \
            src/lib/billing/visa-policy.ts \
            src/lib/billing/visa-provisional-pdf.ts \
            src/lib/billing/financial-ledger.ts \
            src/app/api/desktop/billing/route.ts \
            src/components/billing-document-editor.tsx \
            tests/billing-draft-retention.test.ts \
            tests/billing-financial-ledger.test.ts \
            tests/billing-visa-provisional-pdf.test.ts \
            tests/pennylane-v1-inbound-only.test.ts
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/billing src/app/api/desktop/billing/route.ts src/components/billing-document-editor.tsx tests/billing-draft-retention.test.ts tests/billing-financial-ledger.test.ts tests/billing-visa-provisional-pdf.test.ts tests/pennylane-v1-inbound-only.test.ts
            git commit -m "style(billing): format non-emitting V1 retention work"
            git push
          fi
