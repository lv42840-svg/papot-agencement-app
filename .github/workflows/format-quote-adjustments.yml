name: Format quote adjustments

on:
  push:
    branches:
      - feat/quote-adjustments-options

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-adjustments-options
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/adjustments.ts src/lib/quotes/pricing-mutations.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/adjustments.ts src/lib/quotes/pricing-mutations.ts
          git commit -m "chore: format quote adjustment files"
          git push origin HEAD:feat/quote-adjustments-options
