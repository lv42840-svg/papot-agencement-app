name: Library screen format

on:
  push:
    branches:
      - feat/library-desktop-screen

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-desktop-screen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/library-workspace.tsx src/lib/library/catalog-edit.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/library-workspace.tsx src/lib/library/catalog-edit.ts
          git commit -m "Format Library desktop screen"
          git push origin HEAD:feat/library-desktop-screen
