name: Format Devis temporary

on:
  pull_request:
    branches:
      - spike/nextcloud-transport

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quotes-desktop-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/quotes-workspace.tsx tests/auth-action-permissions.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "PAPOT CI"
          git config user.email "papot-ci@users.noreply.github.com"
          git add src/components/quotes-workspace.tsx tests/auth-action-permissions.test.ts
          git commit -m "Format native quote workspace"
          git push origin HEAD:feature/quotes-desktop-workspace
