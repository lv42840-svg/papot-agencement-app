name: Temp format pdf windows
on:
  push:
    branches:
      - fix/pdf-windows-converter

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/quote-send-action.tsx src/lib/documents/pdf-runtime.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-send-action.tsx src/lib/documents/pdf-runtime.ts
          git commit -m "style: apply prettier pdf windows"
          git push
