name: Format quote headings temporary

on:
  push:
    branches:
      - feat/quote-line-numbering-headings

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-line-numbering-headings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/quote-structured-lines-editor.tsx src/components/quote-direct-editor.tsx src/lib/quotes/mutations.ts src/lib/quotes/numbering.ts tests/quote-heading-mutations.test.ts tests/quote-numbering.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-structured-lines-editor.tsx src/components/quote-direct-editor.tsx src/lib/quotes/mutations.ts src/lib/quotes/numbering.ts tests/quote-heading-mutations.test.ts tests/quote-numbering.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: formater titres et numérotation devis"
          git push
