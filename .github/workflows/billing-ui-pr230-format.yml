name: Format billing tabs PR 230

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-billing-tabs:
    if: github.event.pull_request.number == 230 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/billing-tabs-chantier-drafts-filters-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only billing list changes
        run: |
          ./node_modules/.bin/prettier --write \
            src/components/billing-workspace.tsx \
            src/lib/billing/workspace-list.ts \
            tests/billing-workspace-list.test.ts \
            tests/billing-document-editor-ui.test.ts
      - name: Commit formatting on the PR branch
        run: |
          git add -- src/components/billing-workspace.tsx src/lib/billing/workspace-list.ts tests/billing-workspace-list.test.ts tests/billing-document-editor-ui.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(billing): format invoice tabs and project filters"
          git push origin HEAD:refs/heads/feat/billing-tabs-chantier-drafts-filters-20261031
