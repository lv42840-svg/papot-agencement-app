name: Temp format Outlook
on:
  push:
    branches:
      - feat/quote-open-outlook

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write desktop/outlook-compose.cjs tests/quote-outlook-wiring.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/outlook-compose.cjs tests/quote-outlook-wiring.test.ts
          git commit -m "style: format Outlook integration"
          git push
