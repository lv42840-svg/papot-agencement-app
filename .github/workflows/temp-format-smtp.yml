name: Temporary SMTP formatter

on:
  push:
    branches:
      - fix/agencement-smtp-align-concept

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format SMTP file
        run: npx prettier --write src/lib/quotes/email.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/quotes/email.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format SMTP transport"
          git push
