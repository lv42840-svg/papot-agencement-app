name: Format clients integration

on:
  push:
    branches:
      - feat/clients-module

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clients-module
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: >-
          npx prettier --write
          src/app/api/desktop/clients/route.ts
          'src/app/api/desktop/commercial/[caseId]/documents/route.ts'
          src/app/api/desktop/commercial/route.ts
          src/components/clients-workspace.tsx
          src/lib/clients/domain.ts
          src/lib/commercial/client-integration.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/desktop/clients/route.ts \
            'src/app/api/desktop/commercial/[caseId]/documents/route.ts' \
            src/app/api/desktop/commercial/route.ts \
            src/components/clients-workspace.tsx \
            src/lib/clients/domain.ts \
            src/lib/commercial/client-integration.ts
          git commit -m "chore: format clients module"
          git push origin HEAD:feat/clients-module
