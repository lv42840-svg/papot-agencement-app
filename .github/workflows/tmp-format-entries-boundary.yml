name: Temporary Entries Boundary Formatter

on:
  push:
    branches: [arch/entries-repository-boundary]
    paths:
      - .github/workflows/tmp-format-entries-boundary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/entries-repository-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/entries/nextcloud-repository.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/entries/nextcloud-repository.ts
          git commit -m "Format Entries repository boundary"
          git push origin HEAD:arch/entries-repository-boundary
