name: Format PR 272 temporary
on:
  push:
    branches:
      - feat/selecteurs-coches-recherche-achats-heures-20261118
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/checkbox-choice-list.tsx src/lib/ui/checkbox-selection.ts src/components/pennylane-supplier-picker.tsx src/components/purchase-destination-multi-picker.tsx src/components/purchase-orders-workspace.tsx src/components/purchase-order-edit-workspace.tsx src/components/actual-hours-workspace.tsx tests/checkbox-choice-list.test.ts tests/papot-selecteurs-coches-ui.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/checkbox-choice-list.tsx src/lib/ui/checkbox-selection.ts src/components/pennylane-supplier-picker.tsx src/components/purchase-destination-multi-picker.tsx src/components/purchase-orders-workspace.tsx src/components/purchase-order-edit-workspace.tsx src/components/actual-hours-workspace.tsx tests/checkbox-choice-list.test.ts tests/papot-selecteurs-coches-ui.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formater les listes a coches et les filtres"
            git push origin HEAD:${{ github.ref_name }}
          fi
