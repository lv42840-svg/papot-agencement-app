name: Library format debug

on:
  push:
    branches:
      - feat/library-nextcloud-storage

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/library/storage.ts tests/library-storage.test.ts
      - run: git diff -- src/lib/library/storage.ts tests/library-storage.test.ts
