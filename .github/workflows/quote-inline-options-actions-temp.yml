name: Quote inline options actions temporary

on:
  push:
    branches:
      - fix/quote-inline-options-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-inline-options-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/fix-quote-inline-patch.py
      - run: python scripts/patch-quote-inline-options-actions.py
      - run: npx prettier --write src/components/quote-structured-lines-editor.tsx src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/library-publish.ts tests/quote-library-publish.test.ts tests/quote-table-layout.test.ts tests/quote-inline-options-ui.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- tests/quote-library-publish.test.ts tests/quote-table-layout.test.ts tests/quote-inline-options-ui.test.ts tests/quote-adjustments.test.ts tests/quote-lines-editor.test.ts tests/quote-component-order.test.ts
      - name: Commit quote ergonomics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-structured-lines-editor.tsx src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/library-publish.ts tests/quote-library-publish.test.ts tests/quote-table-layout.test.ts tests/quote-inline-options-ui.test.ts
          git commit -m "fix(quotes): simplifier actions options et bibliotheque"
          git push
