name: Quote summary format readonly

on:
  push:
    branches:
      - feat/quote-fixed-summary

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/quote-fixed-summary.tsx src/lib/quotes/summary.ts tests/quote-summary.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: quote-summary-formatted
          path: |
            src/components/quote-fixed-summary.tsx
            src/lib/quotes/summary.ts
            tests/quote-summary.test.ts
