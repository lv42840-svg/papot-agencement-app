name: Format purchases PR 233

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-purchases:
    if: github.event.pull_request.number == 233 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/purchases-quick-detailed-bc-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format files
        run: |
          ./node_modules/.bin/prettier --write \
            src/lib/purchases/domain.ts \
            src/lib/purchases/repository.ts \
            src/lib/server-db/migrations.ts \
            src/app/api/desktop/purchases/route.ts \
            src/app/achats/page.tsx \
            src/components/purchase-orders-workspace.tsx \
            src/lib/desktop/navigation.ts \
            src/components/chantier-profitability-panel.tsx \
            tests/purchase-orders.test.ts \
            tests/purchases-workspace-ui.test.ts
      - name: Commit formatting
        run: |
          git add -- src/lib/purchases/domain.ts src/lib/purchases/repository.ts src/lib/server-db/migrations.ts src/app/api/desktop/purchases/route.ts src/app/achats/page.tsx src/components/purchase-orders-workspace.tsx src/lib/desktop/navigation.ts src/components/chantier-profitability-panel.tsx tests/purchase-orders.test.ts tests/purchases-workspace-ui.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(purchases): format BC interface and storage"
          git push origin HEAD:refs/heads/feat/purchases-quick-detailed-bc-20261031
