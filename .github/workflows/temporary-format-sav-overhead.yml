name: Format SAV overhead
on:
  push:
    branches: [feat/heures-sav-frais-generaux-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format SAV and general expenses module
        run: |
          npx --no-install prettier --write src/lib/planning/domain.ts src/lib/planning/actual-hours.ts src/lib/planning/personnel.ts src/lib/planning/mutations.ts src/app/api/desktop/planning/actual-hours/route.ts src/components/actual-hours-workspace.tsx src/lib/payroll/indirect-labor-cost.ts src/app/api/desktop/dashboard/sold-summary/route.ts src/components/dashboard-sold-margin-stat.tsx tests/planning-indirect-hours.test.ts tests/planning-postgres.integration.test.ts tests/planning-indirect-hours-ui.test.ts tests/planning-domain.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/domain.ts src/lib/planning/actual-hours.ts src/lib/planning/personnel.ts src/lib/planning/mutations.ts src/app/api/desktop/planning/actual-hours/route.ts src/components/actual-hours-workspace.tsx src/lib/payroll/indirect-labor-cost.ts src/app/api/desktop/dashboard/sold-summary/route.ts src/components/dashboard-sold-margin-stat.tsx tests/planning-indirect-hours.test.ts tests/planning-postgres.integration.test.ts tests/planning-indirect-hours-ui.test.ts tests/planning-domain.test.ts
            git commit -m 'chore(hours): format SAV and overhead module'
            git push origin HEAD:feat/heures-sav-frais-generaux-20261017
          fi
