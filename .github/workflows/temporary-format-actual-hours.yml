name: Format hours module
on:
  push:
    branches: [feat/heures-hebdo-personnel-chantier-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx --no-install prettier --write src/lib/planning/actual-hours.ts src/app/api/desktop/planning/actual-hours/route.ts src/components/actual-hours-workspace.tsx src/app/heures/page.tsx src/lib/desktop/navigation.ts src/app/api/desktop/chantiers/route.ts tests/planning-actual-hours-register.test.ts tests/planning-actual-hours-workspace-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/actual-hours.ts src/app/api/desktop/planning/actual-hours/route.ts src/components/actual-hours-workspace.tsx src/app/heures/page.tsx src/lib/desktop/navigation.ts src/app/api/desktop/chantiers/route.ts tests/planning-actual-hours-register.test.ts tests/planning-actual-hours-workspace-ui.test.ts
            git commit -m 'chore(hours): format actual hours module'
            git push origin HEAD:feat/heures-hebdo-personnel-chantier-20261017
          fi
