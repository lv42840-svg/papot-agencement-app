name: One-time billing per-line visa formatting
on:
  pull_request:
    paths:
      - ".github/workflows/billing-line-visa-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 280 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/billing-chantier-market-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format per-line visa changes
        run: |
          npx prettier --write src/lib/billing/domain.ts src/lib/billing/visa.ts src/app/api/desktop/billing/route.ts src/components/billing-visa-panel.tsx tests/billing-visa.test.ts tests/billing-visa-line-progress.test.ts
      - name: Commit formatting when necessary
        run: |
          git add src/lib/billing/domain.ts src/lib/billing/visa.ts src/app/api/desktop/billing/route.ts src/components/billing-visa-panel.tsx tests/billing-visa.test.ts tests/billing-visa-line-progress.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(billing): format line-by-line visa workflow'
            git push origin HEAD:feat/billing-chantier-market-foundation
          fi
