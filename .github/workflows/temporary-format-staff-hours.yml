name: Format staff hours branch
on:
  push:
    branches: [feat/planning-staff-38h5-absence-default-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format modified source and tests
        run: |
          npx --no-install prettier --write src/lib/planning/capacity.ts src/lib/planning/personnel.ts src/components/grand-planning-workspace.tsx tests/planning-personnel.test.ts tests/planning-staff-hours-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/capacity.ts src/lib/planning/personnel.ts src/components/grand-planning-workspace.tsx tests/planning-personnel.test.ts tests/planning-staff-hours-ui.test.ts
            git commit -m 'chore(planning): format staff hours feature'
            git push origin HEAD:feat/planning-staff-38h5-absence-default-20261017
          fi
