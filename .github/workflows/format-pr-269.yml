name: Format PR 269 temporary
on:
  push:
    branches:
      - feat/accueil-factures-a-valider-sync-6h-12h-20261118
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/achats/factures/page.tsx src/components/purchase-invoices-workspace.tsx src/lib/pennylane/purchase-invoice-store.ts src/app/api/desktop/dashboard/purchase-invoices-summary/route.ts src/components/dashboard-purchase-invoices-stat.tsx src/app/desktop-ready/page.tsx src/app/globals.css src/lib/pennylane/sync.ts src/lib/pennylane/scheduled-sync-auth.ts src/app/api/internal/pennylane/sync/route.ts src/app/api/desktop/pennylane/route.ts src/app/api/desktop/purchase-invoices/route.ts tests/dashboard-purchase-invoices.test.ts tests/pennylane-scheduled-route.test.ts tests/pennylane-scheduled-sync.test.ts tests/pennylane-purchase-invoices.integration.test.ts deploy/agencement-web/README.md .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/achats/factures/page.tsx src/components/purchase-invoices-workspace.tsx src/lib/pennylane/purchase-invoice-store.ts src/app/api/desktop/dashboard/purchase-invoices-summary/route.ts src/components/dashboard-purchase-invoices-stat.tsx src/app/desktop-ready/page.tsx src/app/globals.css src/lib/pennylane/sync.ts src/lib/pennylane/scheduled-sync-auth.ts src/app/api/internal/pennylane/sync/route.ts src/app/api/desktop/pennylane/route.ts src/app/api/desktop/purchase-invoices/route.ts tests/dashboard-purchase-invoices.test.ts tests/pennylane-scheduled-route.test.ts tests/pennylane-scheduled-sync.test.ts tests/pennylane-purchase-invoices.integration.test.ts deploy/agencement-web/README.md .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "style: formater le compteur accueil et la synchro programmee"
            git push origin HEAD:${{ github.ref_name }}
          fi
