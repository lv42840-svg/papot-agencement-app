name: Format DB foundation

on:
  push:
    branches: [arch/local-server-db-foundation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/local-server-db-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/server-db/config.ts src/lib/server-db/index.ts src/lib/server-db/migrations.ts tests/server-db-config.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/server-db/config.ts src/lib/server-db/index.ts src/lib/server-db/migrations.ts tests/server-db-config.test.ts
          git commit -m "style: format database foundation"
          git push origin HEAD:arch/local-server-db-foundation
