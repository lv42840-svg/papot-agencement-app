name: Temporary PR 251 format

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 251
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chantier-folder-lifecycle-20261116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/lib/chantiers/folder-template.ts \
            src/lib/chantiers/folder-template-storage.ts \
            src/lib/chantiers/folder-lifecycle.ts \
            src/lib/chantiers/folder-repair.ts \
            src/lib/commercial/document-storage.ts \
            src/lib/quotes/final-pdf-archive.ts \
            src/app/api/desktop/quotes/'[quoteId]'/send/route.ts \
            src/app/api/admin/chantiers/folder-template/route.ts \
            src/components/chantier-folder-template-editor.tsx \
            src/components/chantier-folder-repair-workspace.tsx \
            tests/chantier-folder-template.test.ts \
            tests/chantier-folder-lifecycle.test.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: format editable chantier folder template'
            git push origin HEAD:fix/chantier-folder-lifecycle-20261116
          fi
