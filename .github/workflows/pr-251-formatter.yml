name: Temporary PR 251 formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 251
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed application and test files
        run: |
          npx prettier --write \
            desktop/business-folder.cjs \
            src/lib/chantiers/folder-lifecycle.ts \
            src/lib/chantiers/folder-repair.ts \
            src/lib/server-files/storage.ts \
            src/lib/commercial/document-storage.ts \
            src/lib/quotes/final-pdf-archive.ts \
            src/app/api/desktop/chantiers/launch/route.ts \
            src/app/api/desktop/commercial/'[caseId]'/documents/route.ts \
            src/app/api/desktop/quotes/'[quoteId]'/send/route.ts \
            src/app/api/admin/chantiers/folders/route.ts \
            src/components/chantier-folder-repair-workspace.tsx \
            src/components/settings-section-nav.tsx \
            src/app/settings/chantiers/page.tsx \
            tests/chantier-folder-lifecycle.test.ts \
            tests/desktop-business-folder.test.ts
      - name: Commit formatter output on repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/business-folder.cjs src/lib/chantiers src/lib/server-files/storage.ts src/lib/commercial/document-storage.ts src/lib/quotes/final-pdf-archive.ts src/app/api/desktop/chantiers/launch/route.ts src/app/api/desktop/commercial/'[caseId]'/documents/route.ts src/app/api/desktop/quotes/'[quoteId]'/send/route.ts src/app/api/admin/chantiers/folders/route.ts src/components/chantier-folder-repair-workspace.tsx src/components/settings-section-nav.tsx src/app/settings/chantiers/page.tsx tests/chantier-folder-lifecycle.test.ts tests/desktop-business-folder.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Prettier to chantier folder repair'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
