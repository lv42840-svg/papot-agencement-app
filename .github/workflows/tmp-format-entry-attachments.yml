name: Temporary Entry Attachments Formatter

on:
  push:
    branches: [arch/entry-attachments-server-files]
    paths:
      - .github/workflows/tmp-format-entry-attachments.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/entry-attachments-server-files
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/api/desktop/entries/capture/route.ts src/lib/entries/attachment-file-cutover.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/desktop/entries/capture/route.ts src/lib/entries/attachment-file-cutover.ts
          git commit -m "Format Entry attachment cutover"
          git push origin HEAD:arch/entry-attachments-server-files
