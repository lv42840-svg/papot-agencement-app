name: Format person-first hours
on:
  push:
    branches: [feat/heures-personne-dabord-chantier-semaine-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed sources and tests
        run: |
          npx --no-install prettier --write src/lib/planning/actual-hours-suggestions.ts src/app/api/desktop/planning/actual-hours/route.ts src/components/actual-hours-workspace.tsx tests/planning-actual-hours-workspace-ui.test.ts tests/planning-hours-person-first-suggestions.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/actual-hours-suggestions.ts src/app/api/desktop/planning/actual-hours/route.ts src/components/actual-hours-workspace.tsx tests/planning-actual-hours-workspace-ui.test.ts tests/planning-hours-person-first-suggestions.test.ts
            git commit -m 'chore(hours): format person-first entry'
            git push origin HEAD:feat/heures-personne-dabord-chantier-semaine-20261017
          fi
