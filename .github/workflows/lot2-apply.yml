name: Apply Lot 2 payroll patch
on:
  push:
    branches: [feat/personnel-paie-lot2]
    paths: [.lot2/READY]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personnel-paie-lot2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore patch and apply against reviewed main snapshot
        run: |
          cat .lot2/part* | base64 -d | xz -d > /tmp/lot2.patch
          git apply --check /tmp/lot2.patch
          git apply /tmp/lot2.patch
          npm install --package-lock-only --ignore-scripts --save-exact exceljs@4.4.0
          rm -rf .lot2
          git rm -f .github/workflows/lot2-review.yml .github/workflows/lot2-apply.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(payroll): monthly holding costs and versioned payroll preparation'
          git push origin HEAD:refs/heads/feat/personnel-paie-lot2
