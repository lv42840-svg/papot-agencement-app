name: Fix quote table layout temporary

on:
  push:
    branches:
      - fix/quote-table-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-table-layout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/fix-quote-table-layout.py
      - run: npx prettier --write src/components/quote-structured-lines-editor.tsx tests/quote-table-layout.test.ts
      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-structured-lines-editor.tsx tests/quote-table-layout.test.ts
          git commit -m "fix(quotes): réaligner le tableau devis en édition"
          git push
