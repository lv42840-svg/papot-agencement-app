name: Polish commercial client flow

on:
  push:
    branches:
      - feat/clients-module

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clients-module
      - name: Apply focused UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/commercial-workspace-v2.tsx")
          text = path.read_text(encoding="utf-8")

          old_errors = '  COMMERCIAL_CLIENT_NOT_FOUND: "Ce client n’existe plus.",'
          new_errors = '''  COMMERCIAL_CLIENT_NOT_FOUND: "Ce client n’existe plus.",
            COMMERCIAL_CLIENT_REQUIRED: "Choisis ou crée un client avant de continuer.",
            COMMERCIAL_CLIENT_INCOMPLETE:
              "Le devis est validé : complète la fiche client (identité, adresse, code postal, ville, conditions de règlement et SIRET si professionnel) avant de confirmer l’affaire.",
            CLIENTS_LOCKED: "Le fichier clients est modifié sur un autre poste. Réessaie dans quelques secondes.",
            CLIENTS_VERSION_CONFLICT: "Le fichier clients a changé sur un autre poste. Réessaie.",'''
          if old_errors not in text:
              raise SystemExit("error mapping anchor not found")
          text = text.replace(old_errors, new_errors, 1)

          old_input = '<input name="clientName" placeholder="Nom du client" />'
          new_input = '<input name="clientName" placeholder="Nom du client" required />'
          if old_input not in text:
              raise SystemExit("new client input anchor not found")
          text = text.replace(old_input, new_input, 1)

          old_storage = "Nextcloud stocke les fichiers. PostgreSQL garde leurs métadonnées. Les anciens devis et déboursés restent consultables comme documents historiques."
          new_storage = "Nextcloud stocke les fichiers et les métadonnées de l’affaire. Les anciens devis et déboursés restent consultables comme documents historiques."
          if old_storage not in text:
              raise SystemExit("storage text anchor not found")
          text = text.replace(old_storage, new_storage, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit focused UI fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/commercial-workspace-v2.tsx
          git commit -m "fix: clarify commercial client validation"
          git push origin HEAD:feat/clients-module
