name: Format clipboard test
on:
  push:
    branches: [feat/planning-clipboard-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write tests/planning-clipboard.test.ts
      - name: Commit formatted fixture
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/planning-clipboard.test.ts
            git commit -m 'chore(planning): format clipboard test'
            git push origin HEAD:feat/planning-clipboard-20261017
          fi
