name: Format multi-entry weekly board
on:
  push:
    branches: [feat/planning-daily-multiactivity-and-weekly-chantiers-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format feature files
        run: |
          npx --no-install prettier --write src/lib/planning/domain.ts src/lib/planning/weekly-board.ts src/lib/planning/capacity.ts src/app/api/desktop/planning/weekly-board/route.ts src/components/weekly-board-day-cell.tsx src/components/weekly-team-board.tsx tests/planning-weekly-multi-entry.test.ts tests/planning-weekly-multi-entry-ui.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/planning/domain.ts src/lib/planning/weekly-board.ts src/lib/planning/capacity.ts src/app/api/desktop/planning/weekly-board/route.ts src/components/weekly-board-day-cell.tsx src/components/weekly-team-board.tsx tests/planning-weekly-multi-entry.test.ts tests/planning-weekly-multi-entry-ui.test.ts
            git commit -m 'chore(planning): format multi-entry weekly board'
            git push origin HEAD:feat/planning-daily-multiactivity-and-weekly-chantiers-20261017
          fi
