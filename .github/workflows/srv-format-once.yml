name: Format PAPOT SRV draft branch (temporary)
on:
  push:
    branches:
      - security/srv-admin-folder-permissions
    paths:
      - .github/workflows/srv-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'lv42840-svg/papot-agencement-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only files modified by the SRV ACL PR
        run: |
          npx prettier --write \
            deploy/srv-explorer/README.md \
            services/srv-explorer/access.mjs \
            services/srv-explorer/checks.mjs \
            services/srv-explorer/public/app.js \
            services/srv-explorer/public/index.html \
            services/srv-explorer/public/style.css \
            services/srv-explorer/server.mjs
      - name: Commit formatting to PR branch only
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add deploy/srv-explorer/README.md services/srv-explorer
            git commit -m "style(srv): format folder permissions implementation"
            git push origin HEAD:security/srv-admin-folder-permissions
          fi
