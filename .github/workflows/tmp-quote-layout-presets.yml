name: Temporary quote layout and palette patch

on:
  push:
    branches:
      - fix/quote-layout-color-presets

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quote-layout-color-presets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/tmp-fix-quote-layout.mjs
      - run: npx prettier --write src/components/quote-structured-lines-editor.tsx src/components/quote-item-presentation-panel.tsx tests/quote-presentation-ui.test.ts tests/quote-table-layout.test.ts
      - run: npm test -- tests/quote-presentation-ui.test.ts tests/quote-table-layout.test.ts tests/quote-adjusted-line-totals-ui.test.ts
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/quote-structured-lines-editor.tsx src/components/quote-item-presentation-panel.tsx tests/quote-presentation-ui.test.ts tests/quote-table-layout.test.ts
          git diff --cached --quiet || git commit -m "fix(quotes): corriger chevauchement et palettes couleurs"
          git push
