name: Format commercial forecast final
on:
  push:
    branches: [feat/commercial-quote-forecast-checkbox-20261017]
permissions:
  contents: write
jobs:
  format-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install prettier --write src/components/commercial-workspace-v2.tsx tests/commercial-quote-forecast.test.ts
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/commercial-workspace-v2.tsx tests/commercial-quote-forecast.test.ts
            git commit -m 'chore(commercial): finalize forecast format'
            git push origin HEAD:feat/commercial-quote-forecast-checkbox-20261017
          fi
