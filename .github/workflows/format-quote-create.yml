name: Format quote create workspace

on:
  push:
    branches:
      - fix/agencement-concurrent-writes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write "src/components/quote-create-workspace.tsx"
      - name: Commit formatting if needed
        run: |
          git add "src/components/quote-create-workspace.tsx"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="PAPOT development" -c user.email="dev@papot.app" commit -m "style(quotes): format create workspace"
          git push origin HEAD:fix/agencement-concurrent-writes
