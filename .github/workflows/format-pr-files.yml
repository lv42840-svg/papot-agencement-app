name: Format auth PR files

on:
  push:
    branches:
      - fix/users-rights-admin

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/users-rights-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR files only
        run: |
          npx prettier --write \
            scripts/bootstrap-admin.ts \
            src/app/api/admin/users/route.ts \
            src/app/api/auth/change-password/route.ts \
            src/app/api/auth/login/route.ts \
            src/app/api/desktop/chantiers/launch/route.ts \
            src/app/api/desktop/chantiers/route.ts \
            src/app/api/desktop/commercial/route.ts \
            src/app/api/desktop/entries/route.ts \
            src/app/change-password/page.tsx \
            src/app/settings/users/page.tsx \
            src/components/change-password-form.tsx \
            src/components/desktop-app-shell.tsx \
            src/components/desktop-sidebar.tsx \
            src/components/login-form.tsx \
            src/components/user-admin-workspace.tsx \
            src/lib/auth/action-permissions.ts \
            src/lib/auth/permission-catalog.ts \
            src/lib/auth/permissions.ts \
            src/lib/auth/session.ts \
            src/lib/auth/user-admin.ts \
            src/lib/desktop/request-context.ts \
            tests/auth-action-permissions.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts src tests
          git commit -m "style: format user rights changes"
          git push origin HEAD:fix/users-rights-admin
