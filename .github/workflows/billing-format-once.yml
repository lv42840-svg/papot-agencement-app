name: Billing formatting helper
on:
  pull_request:
    paths:
      - ".github/workflows/billing-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/billing-chantier-market-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the billing PR sources
        run: |
          npx prettier --write src/lib/billing src/components/billing-document-editor.tsx src/components/billing-workspace.tsx src/components/chantier-billing-tab.tsx src/components/invoice-ouvrages-navigator.tsx src/app/api/desktop/billing/route.ts src/app/api/desktop/billing/markets/route.ts src/app/globals.css tests/billing-*.test.ts
      - name: Commit formatting on PR branch
        run: |
          git add src/lib/billing src/components/billing-document-editor.tsx src/components/billing-workspace.tsx src/components/chantier-billing-tab.tsx src/components/invoice-ouvrages-navigator.tsx src/app/api/desktop/billing/route.ts src/app/api/desktop/billing/markets/route.ts src/app/globals.css tests/billing-*.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style(billing): apply prettier to refactor"
            git push origin HEAD:feat/billing-chantier-market-foundation
          fi
