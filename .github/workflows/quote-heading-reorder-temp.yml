name: Quote heading reorder temporary

on:
  push:
    branches:
      - feat/quote-heading-reorder

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-heading-reorder
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/patch-quote-heading-reorder.py
      - name: Add heading type imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/quotes/mutations.ts')
          source = path.read_text(encoding='utf-8')
          old = '  type QuoteOuvrageComponent,\n} from "./model";'
          new = '  type QuoteOuvrageComponent,\n  type QuoteSection,\n  type QuoteSubsection,\n} from "./model";'
          if source.count(old) != 1:
              raise SystemExit('heading import anchor not found once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npx prettier --write src/lib/quotes/mutations.ts src/components/quote-structured-lines-editor.tsx tests/quote-heading-reorder.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- tests/quote-heading-reorder.test.ts tests/quote-line-reorder.test.ts tests/quote-line-duplication.test.ts tests/quote-lines-editor.test.ts
      - name: Commit heading reorder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/quotes/mutations.ts src/components/quote-structured-lines-editor.tsx tests/quote-heading-reorder.test.ts
          git commit -m "feat(quotes): deplacer les titres et sous-titres"
          git push
