name: Format PR 262 temporary
on:
  push:
    branches:
      - feat/backlog-terrain-261-calcul-heures-achats-20261117
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/api/desktop/planning/actual-hours/route.ts src/app/api/desktop/planning/route.ts src/app/api/desktop/purchases/route.ts src/components/actual-hours-workspace.tsx src/components/grand-planning-workspace.tsx src/components/purchase-order-edit-workspace.tsx src/components/purchase-orders-workspace.tsx src/components/quote-structured-lines-editor.tsx src/lib/numeric-expression.ts src/lib/planning/mutations.ts src/lib/planning/time-markers.ts src/lib/purchases/domain.ts src/lib/quotes/item-reorder.ts src/lib/quotes/mutations.ts tests/numeric-expression.test.ts tests/planning-absence-range.test.ts tests/purchase-supplier-preferences.test.ts tests/quote-free-text.test.ts
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/desktop/planning/actual-hours/route.ts src/app/api/desktop/planning/route.ts src/app/api/desktop/purchases/route.ts src/components/actual-hours-workspace.tsx src/components/grand-planning-workspace.tsx src/components/purchase-order-edit-workspace.tsx src/components/purchase-orders-workspace.tsx src/components/quote-structured-lines-editor.tsx src/lib/numeric-expression.ts src/lib/planning/mutations.ts src/lib/planning/time-markers.ts src/lib/purchases/domain.ts src/lib/quotes/item-reorder.ts src/lib/quotes/mutations.ts tests/numeric-expression.test.ts tests/planning-absence-range.test.ts tests/purchase-supplier-preferences.test.ts tests/quote-free-text.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(#261): prettier du lot retours terrain"
            git push origin HEAD:${{ github.ref_name }}
          fi
