name: Format Nextcloud-only correction

on:
  push:
    branches:
      - fix/nc-only

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format correction files
        run: |
          npx prettier --write \
            src/app/api/auth/bootstrap-admin/route.ts \
            src/app/api/auth/change-password/route.ts \
            'src/app/api/desktop/commercial/[caseId]/documents/route.ts' \
            src/app/api/desktop/commercial/route.ts \
            'src/app/api/desktop/entries/[entryId]/attachments/route.ts' \
            src/app/api/desktop/entries/capture/route.ts \
            src/app/api/desktop/entries/route.ts \
            src/app/api/desktop/shared-resource/route.ts \
            src/app/api/me/accent/route.ts \
            src/app/first-admin/page.tsx \
            src/components/first-admin-form.tsx \
            src/lib/auth/session.ts \
            src/lib/auth/user-admin.ts \
            src/lib/sync/resource-lock.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format Nextcloud-only correction"
          git push
