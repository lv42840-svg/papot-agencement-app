name: Temporary Library Endpoint Switch

on:
  push:
    branches: [arch/library-repository-boundary]
    paths:
      - .github/workflows/tmp-library-endpoint.yml

permissions:
  contents: write

jobs:
  switch-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/library-repository-boundary
          fetch-depth: 0
      - name: Switch Library workspace to dedicated API
        run: sed -i 's#/api/desktop/shared-resource#/api/desktop/library#g' src/components/library-workspace.tsx
      - name: Commit endpoint switch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/library-workspace.tsx
          git commit -m "Use dedicated Library API endpoint"
          git push origin HEAD:arch/library-repository-boundary
