name: Temp format recette
on:
  push:
    branches:
      - fix/recette-devis-ui
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/quote-legal-details-editor.tsx src/components/quote-structured-lines-editor.tsx
      - run: git diff -- src/components/quote-legal-details-editor.tsx src/components/quote-structured-lines-editor.tsx
