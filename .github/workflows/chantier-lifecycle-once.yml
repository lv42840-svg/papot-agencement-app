name: Chantier lifecycle verification

on:
  push:
    branches: [fix/chantier-cancel-close-20261004]
    paths: [.github/workflows/chantier-lifecycle-once.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checked lifecycle changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/chantier-lifecycle-patch.py')
          patch = path.read_text()
          before = '''edit(p, '  DONE: "Terminé",', '  DONE: "Terminé",\\n  CANCELLED: "Annulé",')'''
          after = '''edit(p, '  ACTIVE: "Actif",\\n  DONE: "Terminé",', '  ACTIVE: "Actif",\\n  DONE: "Terminé",\\n  CANCELLED: "Annulé",')'''
          assert patch.count(before) == 1
          patch = patch.replace(before, after)
          patch = patch.replace('mode === "ARCHIVED" ? "isActive" : undefined', 'mode === "ARCHIVED" ? "isActive" : ""')
          exec(compile(patch, str(path), 'exec'))
          PY
      - run: npm ci
      - name: Run installed formatter and validate full repository
        run: |
          node -e 'if (require("prettier/package.json").version !== "3.4.2") process.exit(1)'
          xargs ./node_modules/.bin/prettier --write < /tmp/chantier-changed-files.txt
          ./node_modules/.bin/prettier --write .github/workflows/chantier-lifecycle-once.yml
          npm run format:check
          git diff --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit only verified source and regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git add -- < /tmp/chantier-changed-files.txt
          git diff --cached --stat
          git commit -m 'feat(chantiers): distinguish cancellation and closure with preserved records'
          git push origin HEAD:fix/chantier-cancel-close-20261004
