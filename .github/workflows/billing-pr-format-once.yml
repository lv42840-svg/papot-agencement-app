name: Temporary formatting for billing PR 280

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  formatting:
    if: ${{ github.event.pull_request.number == 280 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/billing-chantier-market-foundation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout billing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only billing changes
        run: |
          npx prettier --write \
            src/lib/billing \
            src/components/billing-document-editor.tsx \
            src/components/billing-workspace.tsx \
            src/components/chantier-billing-tab.tsx \
            src/components/invoice-ouvrages-navigator.tsx \
            src/app/api/desktop/billing \
            src/app/globals.css \
            'tests/billing-*.test.ts'
      - name: Commit formatting if needed
        run: |
          git add src/lib/billing src/components/billing-document-editor.tsx src/components/billing-workspace.tsx src/components/chantier-billing-tab.tsx src/components/invoice-ouvrages-navigator.tsx src/app/api/desktop/billing src/app/globals.css tests/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(billing): apply Prettier formatting'
            git push origin HEAD:feat/billing-chantier-market-foundation
          fi
