name: Temp format VAT alignment
on:
  push:
    branches:
      - fix/pdf-total-vat-alignment

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/quotes/word-v2-vat-renderer.ts tests/quote-word-v2-vat.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/quotes/word-v2-vat-renderer.ts tests/quote-word-v2-vat.test.ts
          git commit -m "style: format VAT alignment"
          git push
