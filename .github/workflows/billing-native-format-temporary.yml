name: Temporary legal invoice formatter

on:
  push:
    branches:
      - feat/billing-chantier-market-foundation
    paths:
      - .github/workflows/billing-native-format-temporary.yml

permissions:
  contents: write

jobs:
  formatter:
    if: github.ref == 'refs/heads/feat/billing-chantier-market-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write \
            src/lib/billing/native-issuance.ts \
            src/lib/billing/native-invoice-pdf.ts \
            src/lib/billing/domain.ts \
            src/lib/auth/permission-catalog.ts \
            src/app/api/desktop/billing/issue/route.ts \
            'src/app/api/desktop/billing/issued/[invoiceId]/pdf/route.ts' \
            src/app/api/desktop/billing/route.ts \
            src/components/billing-document-editor.tsx \
            tests/billing-native-issuance.test.ts \
            tests/billing-native-issuance-ui.test.ts
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/billing/native-issuance.ts src/lib/billing/native-invoice-pdf.ts src/lib/billing/domain.ts src/lib/auth/permission-catalog.ts src/app/api/desktop/billing/issue/route.ts 'src/app/api/desktop/billing/issued/[invoiceId]/pdf/route.ts' src/app/api/desktop/billing/route.ts src/components/billing-document-editor.tsx tests/billing-native-issuance.test.ts tests/billing-native-issuance-ui.test.ts
            git commit -m "style(billing): format legal invoice issuance code"
            git push
          fi
