name: One-time billing free-line ledger formatting
on:
  pull_request:
    paths:
      - ".github/workflows/billing-free-ledger-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.number == 280 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/billing-chantier-market-foundation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format contract billing ledger files only
        run: |
          npx prettier --write src/lib/billing/line-ledger.ts src/lib/billing/document-lines.ts src/lib/billing/progress.ts src/lib/billing/domain.ts src/lib/billing/visa.ts src/components/billing-document-editor.tsx tests/billing-free-line-ledger.test.ts
      - name: Commit only Prettier changes
        run: |
          git add src/lib/billing/line-ledger.ts src/lib/billing/document-lines.ts src/lib/billing/progress.ts src/lib/billing/domain.ts src/lib/billing/visa.ts src/components/billing-document-editor.tsx tests/billing-free-line-ledger.test.ts
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(billing): format cumulative free-line ledger'
            git push origin HEAD:feat/billing-chantier-market-foundation
          fi
