name: Temporary billing formatter

on:
  push:
    branches:
      - feat/billing-chantier-market-foundation
    paths:
      - .github/workflows/billing-format-temporary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  billing-prettier:
    if: github.ref == 'refs/heads/feat/billing-chantier-market-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/billing/financial-ledger.ts tests/billing-financial-ledger.test.ts src/app/api/desktop/billing/route.ts src/lib/billing/domain.ts
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/billing/financial-ledger.ts tests/billing-financial-ledger.test.ts src/app/api/desktop/billing/route.ts src/lib/billing/domain.ts
            git commit -m "style(billing): apply repository Prettier formatting"
            git push
          fi
