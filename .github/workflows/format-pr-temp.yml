name: Formatage temporaire de la PR

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'lv42840-svg' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/mettre-a-jour-tests-francisation-temp.cjs
      - run: npm run format
      - name: Commit si necessaire
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucune mise a jour a appliquer."
            exit 0
          fi
          git config user.name "papot-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Tests: aligner les assertions avec les variables francaises"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
