name: Format quote reactivation tests

on:
  push:
    branches:
      - fix/agencement-concurrent-writes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write "tests/auth-action-permissions.test.ts" "tests/desktop-navigation.test.ts"
      - name: Commit formatting if needed
        run: |
          git add "tests/auth-action-permissions.test.ts" "tests/desktop-navigation.test.ts"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="PAPOT development" -c user.email="dev@papot.app" commit -m "style(quotes): format reactivation tests"
          git push origin HEAD:fix/agencement-concurrent-writes
