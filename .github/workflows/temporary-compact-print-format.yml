name: Format compact weekly print
on:
  push:
    branches: [fix/planning-compact-print-hidden-capacity-20261017]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format compact print files
        run: |
          npx --no-install prettier --write src/components/weekly-team-board.tsx src/components/grand-planning-workspace.tsx tests/planning-personnel-lifecycle.test.ts tests/planning-compact-print.test.ts
      - name: Commit format
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/weekly-team-board.tsx src/components/grand-planning-workspace.tsx tests/planning-personnel-lifecycle.test.ts tests/planning-compact-print.test.ts
            git commit -m 'chore(planning): format compact weekly print'
            git push origin HEAD:fix/planning-compact-print-hidden-capacity-20261017
          fi
