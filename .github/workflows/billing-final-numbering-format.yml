name: Temporary final numbering formatter

on:
  push:
    branches:
      - feat/billing-chantier-market-foundation
    paths:
      - .github/workflows/billing-final-numbering-format.yml

permissions:
  contents: write

jobs:
  formatter:
    if: github.ref == 'refs/heads/feat/billing-chantier-market-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          git fetch origin feat/billing-chantier-market-foundation
          git checkout -B feat/billing-chantier-market-foundation origin/feat/billing-chantier-market-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/billing/native-issuance.ts tests/billing-native-issuance.test.ts
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/billing/native-issuance.ts tests/billing-native-issuance.test.ts
            git commit -m "style(billing): format chantier-optional invoicing"
            git push
          fi
