name: Format PR 271 temporary
on:
  push:
    branches:
      - fix/factures-doublons-identifiant-et-exception-20261118
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/pennylane/purchase-allocations.ts src/lib/pennylane/purchase-invoice-store.ts src/app/api/desktop/purchase-invoices/route.ts src/components/purchase-invoices-workspace.tsx tests/pennylane-purchase-invoices.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pennylane/purchase-allocations.ts src/lib/pennylane/purchase-invoice-store.ts src/app/api/desktop/purchase-invoices/route.ts src/components/purchase-invoices-workspace.tsx tests/pennylane-purchase-invoices.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formater controle doublon fournisseurs"
            git push origin HEAD:${{ github.ref_name }}
          fi
