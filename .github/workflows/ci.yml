name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Prettier to quote adjustment files
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/quote-adjustments-options'
        run: |
          npx prettier --write src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/adjustments.ts
          if ! git diff --quiet -- src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/adjustments.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/quote-pricing-adjustments-editor.tsx src/lib/quotes/adjustments.ts
            git commit -m "style(quotes): format quote adjustments"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: papot_test
          POSTGRES_USER: papot
          POSTGRES_PASSWORD: papot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papot -d papot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPOT_DATABASE_URL: postgresql://papot:papot@localhost:5432/papot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- tests/server-db.integration.test.ts
      - run: npm test -- tests/clients-postgres.integration.test.ts
      - run: npm test -- tests/clients-concurrency.integration.test.ts
      - run: npm test -- tests/auth-postgres.integration.test.ts
      - run: npm test -- tests/entries-postgres.integration.test.ts
      - run: npm test -- tests/commercial-postgres.integration.test.ts
      - run: npm test -- tests/commercial-document-files.integration.test.ts
      - run: npm test -- tests/chantiers-postgres.integration.test.ts
      - run: npm test -- tests/library-postgres.integration.test.ts
