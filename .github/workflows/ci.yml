name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Print quote Prettier diff
        run: |
          npx prettier --write src/app/api/desktop/quotes/route.ts src/lib/quotes/model.ts
          git diff -- src/app/api/desktop/quotes/route.ts src/lib/quotes/model.ts
          exit 1
      - run: npm run format:check
