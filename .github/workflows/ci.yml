name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Print Devis Prettier diff
        run: |
          npx prettier --write src/components/quotes-workspace.tsx tests/auth-action-permissions.test.ts
          git diff -- src/components/quotes-workspace.tsx tests/auth-action-permissions.test.ts
          exit 1
      - run: npm run format:check
