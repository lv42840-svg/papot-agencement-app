name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-pr:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/users-rights-admin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format files touched by this PR
        run: |
          npx prettier --write \
            scripts/bootstrap-admin.ts \
            src/app/api/admin/users/route.ts \
            src/app/api/auth/change-password/route.ts \
            src/app/api/desktop/chantiers/route.ts \
            src/app/api/desktop/commercial/route.ts \
            src/components/change-password-form.tsx \
            src/components/desktop-app-shell.tsx \
            src/components/user-admin-workspace.tsx \
            tests/auth-action-permissions.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/bootstrap-admin.ts src/app/api/admin/users/route.ts src/app/api/auth/change-password/route.ts src/app/api/desktop/chantiers/route.ts src/app/api/desktop/commercial/route.ts src/components/change-password-form.tsx src/components/desktop-app-shell.tsx src/components/user-admin-workspace.tsx tests/auth-action-permissions.test.ts
          git commit -m "style: format user rights changes"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/db
      - run: npm run format:check
