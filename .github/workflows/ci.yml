name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agencement-concept-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier once
        run: |
          npx prettier --write \
            src/app/api/auth/login/route.ts \
            src/app/api/auth/setup-password/route.ts \
            src/components/login-form.tsx \
            src/components/user-admin-workspace.tsx \
            src/lib/auth/domain.ts \
            src/lib/auth/login-policy.ts \
            src/lib/auth/login-rate-limit.ts \
            src/lib/auth/user-admin.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/auth/login/route.ts \
                  src/app/api/auth/setup-password/route.ts \
                  src/components/login-form.tsx \
                  src/components/user-admin-workspace.tsx \
                  src/lib/auth/domain.ts \
                  src/lib/auth/login-policy.ts \
                  src/lib/auth/login-rate-limit.ts \
                  src/lib/auth/user-admin.ts
          git diff --cached --quiet || git commit -m "style(auth): apply repository Prettier"
          git push origin HEAD:feat/agencement-concept-auth
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: papot_test
          POSTGRES_USER: papot
          POSTGRES_PASSWORD: papot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papot -d papot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPOT_DATABASE_URL: postgresql://papot:papot@localhost:5432/papot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- tests/server-db.integration.test.ts
      - run: npm test -- tests/clients-concurrency.integration.test.ts
      - run: npm test -- tests/quotes-postgres.integration.test.ts
      - run: npm test -- tests/planning-postgres.integration.test.ts

  pdf-integration:
    runs-on: ubuntu-latest
    env:
      PAPOT_RUN_PDF_INTEGRATION: "1"
      PAPOT_PDF_ARTIFACT_DIR: tmp/pdf-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install LibreOffice and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - run: npm ci
      - run: npm test -- tests/quote-word-v2-pdf.integration.test.ts
      - name: Upload PDF QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-word-v2-pdf-qa
          path: tmp/pdf-qa
          if-no-files-found: error
