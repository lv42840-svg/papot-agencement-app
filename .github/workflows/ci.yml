name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: papot_test
          POSTGRES_USER: papot
          POSTGRES_PASSWORD: papot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papot -d papot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAPOT_DATABASE_URL: postgresql://papot:papot@localhost:5432/papot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- tests/server-db.integration.test.ts
      - run: npm test -- tests/clients-postgres.integration.test.ts
      - run: npm test -- tests/clients-concurrency.integration.test.ts
      - run: npm test -- tests/auth-postgres.integration.test.ts
      - run: npm test -- tests/entries-postgres.integration.test.ts
      - run: npm test -- tests/commercial-postgres.integration.test.ts
      - run: npm test -- tests/commercial-document-files.integration.test.ts
      - run: npm test -- tests/chantiers-postgres.integration.test.ts
      - run: npm test -- tests/library-postgres.integration.test.ts
      - run: npm test -- tests/quotes-postgres.integration.test.ts

  pdf-integration:
    runs-on: ubuntu-latest
    env:
      PAPOT_RUN_PDF_INTEGRATION: "1"
      PAPOT_PDF_ARTIFACT_DIR: tmp/pdf-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install LibreOffice and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils
      - run: npm ci
      - run: npm test -- tests/quote-word-v2-pdf.integration.test.ts
      - name: Upload PDF QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-word-v2-pdf-qa
          path: tmp/pdf-qa
          if-no-files-found: error
