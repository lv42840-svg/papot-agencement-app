name: Quote client presentation temporary

on:
  push:
    branches:
      - feat/quote-client-presentation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quote-client-presentation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-quote-client-presentation.py')
          s = p.read_text(encoding='utf-8')
          old = "replace_once(editor, '          min-width: 980px;\\n', '          min-width: 1040px;\\n',)"
          new = '''replace_once(
              editor,
              ''' + "'''        .quoteMainRow {\\n          display: grid;\\n          grid-template-columns: 44px minmax(250px, 1fr) 64px 56px 104px 100px 110px 228px;\\n          gap: 8px;\\n          align-items: center;\\n          padding: 9px 14px;\\n          min-width: 980px;\\n        }'''" + ''',
              ''' + "'''        .quoteMainRow {\\n          display: grid;\\n          grid-template-columns: 44px minmax(250px, 1fr) 64px 56px 104px 100px 110px 228px;\\n          gap: 8px;\\n          align-items: center;\\n          padding: 9px 14px;\\n          min-width: 1040px;\\n        }'''" + ''',
          )'''
          if old not in s:
              raise SystemExit('patch guard not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: python -m py_compile scripts/patch-quote-client-presentation.py
      - run: python scripts/patch-quote-client-presentation.py
      - run: npx prettier --write src/lib/quotes/model.ts src/lib/quotes/mutations.ts src/lib/quotes/presentation.ts src/lib/quotes/item-photos.ts src/lib/quotes/item-photo-storage.ts src/app/api/desktop/quotes/[quoteId]/items/[itemId]/photos/route.ts src/app/api/desktop/quotes/[quoteId]/items/[itemId]/photos/[photoId]/route.ts src/components/quote-item-presentation-panel.tsx src/components/quote-structured-lines-editor.tsx tests/quote-presentation.test.ts tests/quote-presentation-ui.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- tests/quote-presentation.test.ts tests/quote-presentation-ui.test.ts tests/quote-lines-editor.test.ts tests/quote-heading-duplication.test.ts tests/quote-table-layout.test.ts
      - name: Commit client presentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/quotes/model.ts src/lib/quotes/mutations.ts src/lib/quotes/presentation.ts src/lib/quotes/item-photos.ts src/lib/quotes/item-photo-storage.ts src/app/api/desktop/quotes/[quoteId]/items/[itemId]/photos/route.ts src/app/api/desktop/quotes/[quoteId]/items/[itemId]/photos/[photoId]/route.ts src/components/quote-item-presentation-panel.tsx src/components/quote-structured-lines-editor.tsx tests/quote-presentation.test.ts tests/quote-presentation-ui.test.ts
          git commit -m "feat(quotes): ajouter mise en forme et photos client"
          git push
