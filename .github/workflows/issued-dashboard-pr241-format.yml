name: Format issued dashboard PR241

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.number == 241 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/monthly-invoiced-dashboard-quote-billing-tracker-20261031'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format updated files
        run: |
          ./node_modules/.bin/prettier --write \
            src/lib/billing/issued-summary.ts \
            src/lib/billing/preparation-followup.ts \
            src/app/api/desktop/dashboard/invoiced-summary/route.ts \
            src/components/dashboard-invoiced-stat.tsx \
            src/app/desktop-ready/page.tsx \
            src/components/billing-workspace.tsx \
            src/app/facturation/page.tsx \
            tests/issued-invoice-summary.test.ts \
            tests/dashboard-sold-ui.test.ts
      - name: Commit formatting
        run: |
          git add -- src/lib/billing/issued-summary.ts src/lib/billing/preparation-followup.ts src/app/api/desktop/dashboard/invoiced-summary/route.ts src/components/dashboard-invoiced-stat.tsx src/app/desktop-ready/page.tsx src/components/billing-workspace.tsx src/app/facturation/page.tsx tests/issued-invoice-summary.test.ts tests/dashboard-sold-ui.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(billing): format invoiced dashboard and quote backlog"
          git push origin HEAD:refs/heads/feat/monthly-invoiced-dashboard-quote-billing-tracker-20261031
