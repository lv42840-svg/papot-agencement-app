name: Temporary Commercial Boundary Formatter

on:
  push:
    branches: [arch/commercial-repository-boundary]
    paths:
      - .github/workflows/tmp-format-commercial-boundary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/commercial-repository-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write 'src/app/api/desktop/commercial/[caseId]/documents/route.ts' src/app/api/desktop/commercial/route.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/api/desktop/commercial/[caseId]/documents/route.ts' src/app/api/desktop/commercial/route.ts
          git commit -m "Format Commercial repository boundary"
          git push origin HEAD:arch/commercial-repository-boundary
