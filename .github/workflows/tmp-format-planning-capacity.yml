name: Temporary Planning Capacity Formatter

on:
  push:
    branches:
      - feat/planning-weekly-capacity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply project Prettier
        run: |
          npx prettier --write \
            src/components/grand-planning-workspace.tsx \
            tests/planning-mutations.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/grand-planning-workspace.tsx tests/planning-mutations.test.ts
          git commit -m "style(planning): applique Prettier à la capacité"
          git push origin "HEAD:${GITHUB_REF_NAME}"
