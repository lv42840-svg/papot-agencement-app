name: Format Pennylane PR (temporary)
on:
  push:
    branches:
      - feat/pennylane-v2-readonly-staging
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pennylane-v2-readonly-staging
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/lib/pennylane src/app/api/desktop/pennylane tests/pennylane-readonly.test.ts tests/pennylane-staging.integration.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pennylane src/app/api/desktop/pennylane tests/pennylane-readonly.test.ts tests/pennylane-staging.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(pennylane): apply Prettier formatting"
            git push origin HEAD:feat/pennylane-v2-readonly-staging
          fi
